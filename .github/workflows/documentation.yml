name: Deploy DocC Documentation to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Symbol Graphs & Generate Documentation
        run: |
          mkdir -p .build/symbol-graphs
          swift build -Xswiftc -emit-symbol-graph -Xswiftc -emit-symbol-graph-dir -Xswiftc "$(pwd)/.build/symbol-graphs"
          xcrun docc convert Sources/TestingSupport/TestingSupport.docc \
            --additional-symbol-graph-dir .build/symbol-graphs \
            --output-dir ./docs-out \
            --hosting-base-path testing-support

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
